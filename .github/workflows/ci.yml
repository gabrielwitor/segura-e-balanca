# Seção 15: lint, tipos, unitários, regras e E2E a cada PR; preview por PR; produção na main.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4 # o Emulator do Firestore roda em Java
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx firebase emulators:exec --only firestore --project demo-seb "npm run test:rules"
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build -- --mode emulador
      - run: npx firebase emulators:exec --only firestore,auth --project demo-seb "npm run test:e2e"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report/, retention-days: 14 }
  publicar:
    needs: [verificar, regras, e2e]
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write, checks: write }
    environment: ${{ github.event_name == 'push' && 'producao' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # PR → canal de preview no segura-e-balanca-dev (link comentado no PR, expira em 7 dias)
      - if: github.event_name == 'pull_request'
        run: npm run build -- --mode dev
      - if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SA_DEV }}
          projectId: segura-e-balanca-dev
          expires: 7d
      # main → produção: app + regras + índices
      - if: github.event_name == 'push'
        run: npm run build -- --mode prod
      - if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with: { credentials_json: '${{ secrets.FIREBASE_SA_PROD }}' }
      - if: github.event_name == 'push'
        run: npx firebase deploy --only hosting,firestore:rules,firestore:indexes --project prod --non-interactive
